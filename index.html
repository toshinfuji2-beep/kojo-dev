<body><div style="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#e8505b;color:#fff;font:700 11px sans-serif;text-align:center;padding:2px;pointer-events:none">担任助手・確認用（生徒には配らないURL）</div>
<div id="app">
  <main id="main">
    <section id="stage">
      <canvas id="cv"></canvas>
      <header id="hud">
        <button id="btnBack" class="btn hud-b icon" aria-label="ほかの人に切り替える" title="ほかの人に切り替える"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="meChip" class="btn" aria-label="自分のプロフィール"><img id="meFace" alt="" width="36" height="36"><span class="mc-t"><span id="meNick"></span><span id="ptsBox" title="あなたのピコ"><span class="coin sm" id="coin"></span><b id="pts">0</b><i>ピコ</i></span></span></button>
        <div class="hud-sp"></div>
        <button id="btnRank" class="btn hud-b" aria-label="順位"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3M12 13v4M8 20h8"/></svg><span class="tl">順位</span></button>
        <button id="btnSet" class="btn hud-b icon" aria-label="設定"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4L10.7 6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.3 2.7h4l.3-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
        <button id="panelToggle" class="btn hud-b icon" aria-label="パネル開閉">▶</button>
      </header>
      <div id="hudSub">
        <div id="rank" title="ランク"><span id="rankName">見習い</span><span class="rk-n" id="rankNext"></span></div>
        <button id="btnPend" class="btn" hidden aria-label="承認まち（タップでくわしく）">承認まち</button>
        <button id="btnRecent" class="btn" aria-label="みんなの最近">みんなの最近</button>
        <button id="bankBox" class="btn" aria-label="チーミ貯金箱（寄付する）"><span class="bk-l">貯金箱</span><b id="bank">0</b></button>
      </div>
      <!-- 週間ミッション：部屋の左上に小さく常に表示。タップでくわしく（ひとりひとりの達成状況） -->
      <button id="btnMission" class="btn" hidden aria-label="ミッション（タップでくわしく）"></button>
      <div id="bar"></div>
      <div id="dock">
        <nav id="rooms" aria-label="部屋"></nav>
        <div id="tools">
          <div id="viewWrap">
            <button id="btnView" class="btn tool" aria-haspopup="true" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="tl">視点</span></button>
            <div id="viewPop" hidden>
              <div id="camModes" role="group" aria-label="カメラの向き">
                <button class="btn on" data-m="iso">斜め</button><button class="btn" data-m="top">真上</button><button class="btn" data-m="wallL">左の壁</button><button class="btn" data-m="wallR">右の壁</button>
              </div>
              <button id="camReset" class="btn ghost" aria-label="カメラを戻す">⟲ もとにもどす</button>
            </div>
          </div>
          <button id="btnLight" class="btn tool"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V15h8v-1.5A6 6 0 0 0 12 3z"/></svg><span class="tl">電気を消す</span></button>
          <button id="btnMulti" class="btn tool"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" stroke-dasharray="3 3"/><path d="M8 12l3 3 5-6"/></svg><span class="tl">まとめて選ぶ</span></button>
          <button id="btnNotes" class="btn tool" hidden><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"/></svg><span class="tl">伝言板</span></button>
          <button id="btnTeams" class="btn tool" hidden><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3zM10 20v-6h4v6"/></svg><span class="tl">ほかのチーミへ</span></button>
        </div>
      </div>
      <div id="toasts"></div>
    </section>
    <aside id="panel">
      <!-- ミッション：家具・アイテムのタブと見分けられるよう、タブの上に別の帯ボタン。押すとパネルにチーミの達成状況 -->
      <button id="msTab" class="btn" hidden aria-label="ミッション（チーミの達成状況）"></button>
      <div id="tabs"></div>
      <div id="tabBody"></div>
    </aside>
  </main>
